<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">AI learning companion — experiment blueprint</title>
  <desc id="desc">A planned learning workflow: question, retrieval, local language model, evaluation, and feedback guiding the next question.</desc>
  <defs>
    <linearGradient id="panel" x2="1200" y2="280" gradientUnits="userSpaceOnUse"><stop stop-color="#0C1420"/><stop offset="1" stop-color="#101323"/></linearGradient>
    <linearGradient id="flow" x1="76" x2="1124" gradientUnits="userSpaceOnUse"><stop stop-color="#7EE1D3"/><stop offset=".5" stop-color="#8ED9EF"/><stop offset="1" stop-color="#B9ABF5"/></linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" stroke="#7B91AC" stroke-width="1.2"/></marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .flow { stroke-dasharray: 3 13; animation: flow 5s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -64; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <rect x=".5" y=".5" width="1199" height="279" rx="20" fill="url(#panel)" stroke="#2B354B"/>
  <text class="mono" x="36" y="38" fill="#8294B1" font-size="11" letter-spacing="1.8">EXPERIMENT BLUEPRINT / AI LEARNING COMPANION</text>
  <rect x="1010" y="20" width="154" height="26" rx="13" stroke="#514674" fill="#211D36"/>
  <text class="mono" x="1087" y="37" fill="#C4B5F6" font-size="10" text-anchor="middle" letter-spacing="1">BUILD DIRECTION</text>
  <rect x="36" y="76" width="255" height="105" rx="12" fill="#0E1928" stroke="#2C3A50"/>
  <path d="M52 76H99" stroke="#7EE1D3" stroke-width="2"/>
  <text class="mono" x="55" y="104" fill="#7EE1D3" font-size="11">01 /</text>
  <text x="55" y="134" fill="#EEF3FC" font-size="23" font-weight="600">Question</text>
  <text x="55" y="159" fill="#9AACC5" font-size="13">A learning goal</text>
  <path d="M297 129H319" stroke="#7B91AC" marker-end="url(#arrow)"/>
  <rect x="327" y="76" width="255" height="105" rx="12" fill="#0E1928" stroke="#2C3A50"/>
  <path d="M343 76H390" stroke="#83DFE4" stroke-width="2"/>
  <text class="mono" x="346" y="104" fill="#83DFE4" font-size="11">02 /</text>
  <text x="346" y="134" fill="#EEF3FC" font-size="23" font-weight="600">Retrieve</text>
  <text x="346" y="159" fill="#9AACC5" font-size="13">Relevant knowledge</text>
  <path d="M588 129H610" stroke="#7B91AC" marker-end="url(#arrow)"/>
  <rect x="618" y="76" width="255" height="105" rx="12" fill="#0E1928" stroke="#2C3A50"/>
  <path d="M634 76H681" stroke="#8ED9EF" stroke-width="2"/>
  <text class="mono" x="637" y="104" fill="#8ED9EF" font-size="11">03 /</text>
  <text x="637" y="134" fill="#EEF3FC" font-size="23" font-weight="600">Reason</text>
  <text x="637" y="159" fill="#9AACC5" font-size="13">Local LLM + context</text>
  <path d="M879 129H901" stroke="#7B91AC" marker-end="url(#arrow)"/>
  <rect x="909" y="76" width="255" height="105" rx="12" fill="#0E1928" stroke="#2C3A50"/>
  <path d="M925 76H972" stroke="#B9ABF5" stroke-width="2"/>
  <text class="mono" x="928" y="104" fill="#B9ABF5" font-size="11">04 /</text>
  <text x="928" y="134" fill="#EEF3FC" font-size="23" font-weight="600">Evaluate</text>
  <text x="928" y="159" fill="#9AACC5" font-size="13">Quality + failure cases</text>
  <path d="M1036 192V224H164V193" stroke="#35465F" marker-end="url(#arrow)"/>
  <path class="flow" d="M1036 192V224H164" stroke="url(#flow)" stroke-opacity=".8"/>
  <rect x="440" y="212" width="320" height="25" rx="12" fill="#0E1725"/>
  <text class="mono" x="600" y="229" fill="#9EB2CF" font-size="11" text-anchor="middle" letter-spacing=".6">FEEDBACK → THE NEXT LEARNING STEP</text>
  <text class="mono" x="600" y="260" fill="#71839F" font-size="10" text-anchor="middle" letter-spacing="1.2">RETRIEVAL · LOCAL INFERENCE · EVALUATION · PROGRESS</text>
</svg>
